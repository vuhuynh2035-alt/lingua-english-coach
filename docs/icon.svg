<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="sea" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset=".6" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="0" cy="0" r="27"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0c2a52" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="205" fill="#ffffff" opacity=".55"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="#ffffff" stroke-width="5" opacity=".8"/>

  <!-- the book, tilted -->
  <g transform="rotate(-11 256 262)">
    <ellipse cx="262" cy="428" rx="112" ry="14" fill="#0c2a52" opacity=".22"/>
    <g filter="url(#shadow)">
      <!-- page block: visible on the right and at the bottom -->
      <path d="M168 132 H342 a14 14 0 0 1 14 14 V396 a14 14 0 0 1 -14 14 H168 Z" fill="#fff7e6"/>
      <path d="M356 146 V396" stroke="#e7d9bd" stroke-width="2"/>
      <g stroke="#e7d9bd" stroke-width="2" opacity=".9"><path d="M346 150 V392"/><path d="M336 154 V388"/></g>
      <path d="M176 402 H344" stroke="#e7d9bd" stroke-width="2"/>
      <!-- front cover -->
      <rect x="150" y="112" width="198" height="282" rx="14" fill="url(#cover)"/>
      <!-- spine -->
      <path d="M150 126 a14 14 0 0 1 14 -14 H178 V394 H164 a14 14 0 0 1 -14 -14 Z" fill="url(#spine)"/>
      <path d="M178 112 V394" stroke="#93c5fd" stroke-width="3" opacity=".55"/>
      <rect x="186" y="122" width="152" height="262" rx="8" fill="none" stroke="#bfdbfe" stroke-width="2" opacity=".5"/>
      <!-- bookmark -->
      <path d="M318 394 V430 L329 421 L340 430 V394 Z" fill="#ef4444"/>
    </g>

    <!-- label on the cover -->
    <rect x="196" y="150" width="132" height="86" rx="12" fill="#fff8e1" stroke="url(#gold)" stroke-width="5"/>
    <text x="262" y="193" font-size="34" font-weight="800" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Noto Sans JP, Yu Gothic UI, Microsoft YaHei UI, Arial, sans-serif">Learn</text>
    <text x="262" y="224" font-size="29" font-weight="800" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Noto Sans JP, Yu Gothic UI, Microsoft YaHei UI, Arial, sans-serif">language</text>

    <!-- small globe under the label -->
    <g transform="translate(262 308)">
      <circle r="31" fill="none" stroke="#fde68a" stroke-width="3" opacity=".9"/>
      <circle r="27" fill="url(#sea)"/>
      <g clip-path="url(#ball)">
        <path d="M-6 -18 q14 -8 22 2 q2 12 -6 18 q8 8 2 20 q-12 6 -18 -4 q-2 -14 -8 -20 q-4 -10 8 -16z" fill="#4ade80"/>
        <path d="M-24 -6 q8 -8 12 0 q-2 12 -10 14 q-6 -8 -2 -14z" fill="#4ade80"/>
        <g fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".5"><ellipse rx="12" ry="27"/><path d="M-27 0H27"/><path d="M0 -27V27"/></g>
      </g>
    </g>
    <path d="M338 122l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#fde68a" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- greeting bubbles -->
  <g filter="url(#shadow)">
    <path d="M70 70 h98 a18 18 0 0 1 18 18 v22 a18 18 0 0 1 -18 18 h-62 l-18 18 v-18 h-18 a18 18 0 0 1 -18 -18 v-22 a18 18 0 0 1 18 -18z" fill="#ffffff"/>
    <path d="M372 54 h92 a18 18 0 0 1 18 18 v22 a18 18 0 0 1 -18 18 h-12 v18 l-18 -18 h-62 a18 18 0 0 1 -18 -18 v-22 a18 18 0 0 1 18 -18z" fill="#ef4444"/>
    <path d="M58 366 h62 a16 16 0 0 1 16 16 v16 a16 16 0 0 1 -16 16 h-34 l-16 16 v-16 h-12 a16 16 0 0 1 -16 -16 v-16 a16 16 0 0 1 16 -16z" fill="#ef4444"/>
    <path d="M388 360 h80 a16 16 0 0 1 16 16 v24 a16 16 0 0 1 -16 16 h-52 l-16 16 v-16 h-12 a16 16 0 0 1 -16 -16 v-24 a16 16 0 0 1 16 -16z" fill="#ffffff"/>
  </g>
  <text x="119" y="108" font-size="30" font-weight="800" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Noto Sans JP, Yu Gothic UI, Microsoft YaHei UI, Arial, sans-serif">Hello!</text>
  <text x="418" y="92" font-size="25" font-weight="800" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Noto Sans JP, Yu Gothic UI, Microsoft YaHei UI, Arial, sans-serif">Xin chào!</text>
  <text x="96" y="400" font-size="32" font-weight="800" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Noto Sans JP, Yu Gothic UI, Microsoft YaHei UI, Arial, sans-serif">你好</text>
  <text x="430" y="395" font-size="21" font-weight="800" text-anchor="middle" fill="#be185d" font-family="Segoe UI, Noto Sans JP, Yu Gothic UI, Microsoft YaHei UI, Arial, sans-serif">こんにちは</text>
</svg>
