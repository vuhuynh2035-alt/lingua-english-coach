<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12b886"/>
      <stop offset="0.55" stop-color="#0e9f9a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e8f7c"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06302e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="420" cy="92" r="150" fill="#ffffff" opacity="0.08"/>
  <circle cx="70" cy="470" r="130" fill="#ffffff" opacity="0.06"/>

  <!-- AI circuit traces -->
  <g stroke="#bff7ea" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M378 150 L378 104 L420 104"/>
    <path d="M412 196 L452 196"/>
  </g>
  <g fill="#bff7ea">
    <circle cx="420" cy="104" r="13"/>
    <circle cx="452" cy="196" r="13"/>
  </g>

  <!-- Speech bubble -->
  <g filter="url(#shadow)">
    <path d="M118 128 H366 a52 52 0 0 1 52 52 V310 a52 52 0 0 1 -52 52 H222 L150 420 L162 362 H118 a52 52 0 0 1 -52 -52 V180 a52 52 0 0 1 52 -52 Z" fill="#ffffff"/>
  </g>

  <!-- "EN" drawn as shapes so it renders the same everywhere -->
  <g fill="url(#ink)">
    <!-- E -->
    <path d="M118 182 H210 V214 H156 V232 H202 V262 H156 V282 H212 V314 H118 Z"/>
    <!-- N -->
    <path d="M232 182 H268 L326 260 V182 H362 V314 H328 L268 234 V314 H232 Z"/>
  </g>

  <!-- AI sparkles -->
  <path d="M392 196 C398 236 410 248 450 254 C410 260 398 272 392 312 C386 272 374 260 334 254 C374 248 386 236 392 196 Z" fill="url(#star)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  <!-- "AI" badge -->
  <g filter="url(#shadow)">
    <rect x="352" y="370" width="118" height="70" rx="35" fill="url(#star)" stroke="#ffffff" stroke-width="6"/>
  </g>
  <g fill="#0b3b5c" fill-rule="evenodd">
    <path d="M374 425 L394 383 H410 L430 425 H414 L410 416 H394 L390 425 Z M398 405 H406 L402 395 Z"/>
    <rect x="437" y="383" width="15" height="42" rx="2"/>
  </g>
</svg>
